services:
  mongodb:
    image: mongo:7.0-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: healgym
    volumes:
      - mongodb_data:/data/db
    networks:
      - healgym-network
    ports:
      - "27017:27017"

  backend:
    build: 
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/healgym?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret-in-production}
      FRONTEND_URL: http://localhost:3000
      EMAIL_SERVICE: gmail
      EMAIL_FROM: zgustavoaguiar@gmail.com
      EMAIL_PASSWORD: jirdrxbkfgfchumn
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - healgym-network
    ports:
      - "5000:5000"

  frontend:
    build: 
      context: ./frontend
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - healgym-network
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongodb_data:

networks:
  healgym-network:
    driver: bridge
