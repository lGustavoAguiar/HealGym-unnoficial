services:
  mongodb:
    image: mongo:7.0-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Defina MONGO_ROOT_USERNAME no arquivo .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD no arquivo .env}
      MONGO_INITDB_DATABASE: healgym
    volumes:
      - mongodb_data:/data/db
    networks:
      - healgym-network
    ports:
      - '127.0.0.1:27017:27017'

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:?Defina MONGO_ROOT_USERNAME no arquivo .env}:${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD no arquivo .env}@mongodb:27017/healgym?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      FRONTEND_URL: http://localhost:3000
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      USDA_API_KEY: ${USDA_API_KEY:-DEMO_KEY}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - healgym-network
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Origem do backend sem /api — o frontend acrescenta /api em api.js
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - healgym-network
    ports:
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  mongodb_data:

networks:
  healgym-network:
    driver: bridge
